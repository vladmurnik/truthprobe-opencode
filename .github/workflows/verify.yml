name: verify

# Runs on GitHub-hosted VMs (ubuntu / windows / macos) — the CI "virtual machine" that proves
# the patch actually installs and produces truthprobe verdicts, not just compiles.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCODE_BASE: 007afb1b0c8a36dff93d7945909d4e976545ba95

jobs:
  # 1. Pure repo tests: reference math and probe logic, no opencode tree needed.
  scoring:
    name: repo unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun --version
      - run: bun test test/score.test.ts
      - run: bun test test/capability.test.ts

  # 2. Patch applies on a clean upstream clone — linux and windows, with the installers themselves.
  installer:
    name: installer dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install.sh --dry-run
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          chmod +x install.sh
          ./install.sh --dir "$RUNNER_TEMP/tp" --dry-run
          test -f "$RUNNER_TEMP/tp/packages/core/src/truthprobe/score.ts"

      - name: install.ps1 -DryRun
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          ./install.ps1 -Dir "$env:RUNNER_TEMP/tp" -DryRun
          if (-not (Test-Path "$env:RUNNER_TEMP/tp/packages/core/src/truthprobe/score.ts")) {
            throw "patch did not produce the truthprobe sources"
          }

  # 3. Full patched tree on linux: deps, typecheck, truthprobe tests, and the end-to-end mock run.
  patch:
    name: patched tree + end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: clone opencode at the patch base
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/sst/opencode upstream
          cd upstream
          git checkout "$OPENCODE_BASE"

      - name: apply TruthProbe patch
        shell: bash
        run: |
          cd upstream
          git -c user.name=ci -c user.email=ci@local am ../patches/truthprobe-0001.patch
          git log --oneline -3

      - name: install dependencies
        shell: bash
        run: cd upstream && bun install

      - name: typecheck patched packages
        shell: bash
        run: |
          cd upstream
          bun run --cwd packages/schema typecheck
          bun run --cwd packages/ai typecheck
          bun run --cwd packages/core typecheck
          bun run --cwd packages/client typecheck

      - name: truthprobe tests
        shell: bash
        run: |
          cd upstream/packages/core
          bun test test/truthprobe.test.ts test/truthprobe-levels.test.ts test/truthprobe-scorer.test.ts test/truthprobe-capability.test.ts

      - name: end-to-end run against the mock provider
        shell: bash
        run: |
          cd upstream
          python3 ../scripts/mock-openai-logprobs.py 8899 &
          MOCK=$!
          sleep 2
          OPENCODE_CONFIG=../scripts/mock-opencode.json \
            bun run --cwd packages/cli src/index.ts run --standalone --model mock/mock-1 "capital of France?" > run.log 2>&1 || cat run.log
          kill $MOCK || true
          python3 ../scripts/check-db.py > db.txt 2>&1 || true
          cat db.txt | head -40
          grep -q '"truthprobe"' db.txt || { echo "no truthprobe verdict in the database"; cat run.log; exit 1; }
          grep -q '"status": *"ok"' db.txt || { echo "verdict is not ok"; cat db.txt; exit 1; }

  # 4. Build the CLI from the patched tree, so a broken build fails the PR instead of users.
  build:
    name: cli build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: patch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: clone and patch
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/sst/opencode upstream
          cd upstream
          git checkout "$OPENCODE_BASE"
          git -c user.name=ci -c user.email=ci@local am ../patches/truthprobe-0001.patch

      - name: install dependencies
        shell: bash
        run: cd upstream && bun install

      - name: build
        shell: bash
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_CHANNEL: dev
        run: |
          cd upstream/packages/cli
          bun run script/build.ts --skip-install

      - name: smoke the built binary
        shell: bash
        run: |
          cd upstream/packages/cli/dist
          BIN=$(find . -name "opencode*" -type f -perm -u+x | head -1)
          echo "binary: $BIN"
          "$BIN" --version
