name: verify

# CI on GitHub-hosted runners: proves the patch installs, the tests pass, and a real
# run produces a truthprobe verdict — not just that the code compiles.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  BASE: 007afb1b0c8a36dff93d7945909d4e976545ba95

jobs:
  # 1. Reference math and probe logic without cloning opencode (~10 s).
  scoring:
    name: repo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
# pinned instead of latest: dereferencing latest goes through the GitHub API, which
# answers 403 to anonymous requests from shared runners (run 22 failed that way)
          bun-version: 1.4.5
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun test test
      - name: docs numbers match the patch
        run: bash scripts/check-docs.sh

  # 2. Both installers must at least apply the patch cleanly on a clean VM.
  installer-dry-run:
    name: installer dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
# pinned instead of latest: dereferencing latest goes through the GitHub API, which
# answers 403 to anonymous requests from shared runners (run 22 failed that way)
          bun-version: 1.4.5
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install.sh --dry-run (linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x install.sh
          ./install.sh --dir "$RUNNER_TEMP/tp" --dry-run

      - name: install.ps1 -DryRun (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Dir "$env:RUNNER_TEMP\tp" -DryRun

  # 3. The real thing: patched tree, deps, typecheck, unit tests.
  patch:
    name: patched tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
# pinned instead of latest: dereferencing latest goes through the GitHub API, which
# answers 403 to anonymous requests from shared runners (run 22 failed that way)
          bun-version: 1.4.5
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: clone opencode at the patch base
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/sst/opencode upstream
          cd upstream
          git checkout "$BASE"

      - name: apply TruthProbe patch
        shell: bash
        run: |
          cd upstream
          git -c user.name=ci -c user.email=ci@local am ../patches/truthprobe-0001.patch
          git log --oneline -3

      - name: install dependencies
        shell: bash
        run: cd upstream && bun install

      - name: typecheck patched packages
        shell: bash
        run: |
          cd upstream
          bun run --cwd packages/schema typecheck
          bun run --cwd packages/ai typecheck
          bun run --cwd packages/core typecheck
          bun run --cwd packages/client typecheck
          bun run --cwd packages/session-ui typecheck
          bun run --cwd packages/tui typecheck
          bun run --cwd packages/desktop typecheck

      - name: truthprobe tests
        shell: bash
        run: |
          cd upstream/packages/core
          bun test test/truthprobe.test.ts
          bun test test/truthprobe-levels.test.ts test/truthprobe-scorer.test.ts

      # These tests used to silently end up in describe.skip: the file sat in a repository
      # where ../src does not exist. We copy it into the tree and require it to run.
      - name: truthprobe protocol tests (ai layer)
        shell: bash
        env:
          TRUTHPROBE_REQUIRE_PROTOCOL_TESTS: "1"
        run: |
          cp test/opencode-tree/protocol.test.ts upstream/packages/ai/test/truthprobe-protocol.test.ts
          cd upstream/packages/ai
          bun test test/truthprobe-protocol.test.ts

  # 4. End-to-end on Linux: mock provider that emits logprobs → CLI → SQLite part
  #    must contain truthprobe with status ok and a numeric score.
  e2e:
    name: end-to-end verdict
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
# pinned instead of latest: dereferencing latest goes through the GitHub API, which
# answers 403 to anonymous requests from shared runners (run 22 failed that way)
          bun-version: 1.4.5
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: clone, patch, install
        run: |
          git clone --filter=blob:none https://github.com/sst/opencode upstream
          cd upstream
          git checkout "$BASE"
          git -c user.name=ci -c user.email=ci@local am ../patches/truthprobe-0001.patch
          bun install

      - name: start mock provider
        run: |
          python3 scripts/mock-openai-logprobs.py 8899 > mock.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8899/v1/models > /dev/null; then break; fi
            sleep 0.5
          done
          cat mock.log

      - name: run opencode against the mock
        run: |
          cd upstream
          OPENCODE_CONFIG="$GITHUB_WORKSPACE/scripts/mock-opencode.json" \
            bun run --cwd packages/cli src/index.ts run --model mock/mock-1 \
            "What is the capital of France? Answer in two sentences." | tee run.log
          test -s run.log

      - name: assert the verdict landed in the database
        run: |
          python3 - <<'PY'
          import glob, json, os, sqlite3, sys
          rows = []
          for db in glob.glob(os.path.expanduser("~/.local/share/opencode/*.db")):
              try:
                  con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
                  cur = con.cursor()
                  cur.execute("SELECT name FROM sqlite_master WHERE type='table'")
                  tables = {r[0] for r in cur.fetchall()}
                  if "session_part" not in tables:
                      continue
                  cur.execute("SELECT data FROM session_part")
                  for (data,) in cur.fetchall():
                      probe = json.loads(data).get("truthprobe")
                      if probe:
                          rows.append((db, probe))
              except Exception as exc:
                  print(f"skip {db}: {exc}")
          if not rows:
              sys.exit("FAIL: no truthprobe field in any session part")
          db, probe = rows[-1]
          print("db:", db)
          print(json.dumps(probe)[:400])
          if probe.get("status") != "ok":
              sys.exit(f"FAIL: status is {probe.get('status')} ({probe.get('reason')})")
          if not isinstance(probe.get("score"), (int, float)):
              sys.exit("FAIL: score is not numeric")
          print("OK: score", probe["score"], "level", probe.get("level"))
          PY

  # 5. The CLI must still build from the patched tree.
  build:
    name: cli build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: patch
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
# pinned instead of latest: dereferencing latest goes through the GitHub API, which
# answers 403 to anonymous requests from shared runners (run 22 failed that way)
          bun-version: 1.4.5
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: clone, patch, install
        run: |
          git clone --filter=blob:none https://github.com/sst/opencode upstream
          cd upstream
          git checkout "$BASE"
          git -c user.name=ci -c user.email=ci@local am ../patches/truthprobe-0001.patch
          bun install

      - name: build
        env:
          OPENCODE_TARGET: linux-x64
          OPENCODE_CHANNEL: dev
        run: |
          cd upstream/packages/cli
          bun run script/build.ts --skip-install

      - name: smoke the binary
        run: |
          cd upstream/packages/cli/dist
          BIN=$(find . -maxdepth 3 -type f -name 'opencode' | head -1)
          echo "binary: $BIN"
          "$BIN" --version
